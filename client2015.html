<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="apple-mobile-web-app-capable" content="yes">

html,body{margin:0;height:100%;overflow:hidden;background:#7fa9d8;font-family:"Source Sans Pro",Arial,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:none}
body{position:fixed;inset:0;width:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{-webkit-user-select:text;user-select:text;font-size:16px!important}
canvas{display:block;width:100%;height:100%}

#startScreen{position:absolute;left:0;top:0;width:100%;height:100%;background:black;z-index:20000;text-align:center;overflow:auto;touch-action:auto}
#startScreen .label{color:white;font-family:Arial;font-size:16px}
#startScreen .field{display:block;margin:0 auto 12px auto;width:240px}
#startScreen .space{height:14px}
#netBox{width:270px;margin:0 auto;padding:10px;border:1px solid #555}
#netBox button{margin:4px 0}
#netStatus{min-height:20px;margin-top:6px}

<div id="startScreen">
<br><br>

<input type="text" id="username" class="field" placeholder="username">

<input type="text" id="placeTitle" class="field" placeholder="game title" maxlength="40">

<input type="text" id="creatorName" class="field" placeholder="creator name" maxlength="20">

<label for="rbxlxFile" class="label">Load an RBXLX place (.rbxlx)</label>
<br>
<input type="file" id="rbxlxFile" accept=".rbxlx,.xml,application/xml,text/xml">

<div class="space"></div>

<label class="label">
<input type="checkbox" id="showLeaderboard"> Show leaderboard
</label>

<div class="space"></div>

<span class="label">Builders Club:</span>
<select id="buildersClub" onchange="updateClubIcon()">
<option value="">None</option>
<option value="BC">Builders Club</option>
<option value="TBC">Turbo Builders Club</option>
<option value="OBC">Outrageous Builders Club</option>
</select>
<img id="clubIcon" width="16" height="16" style="vertical-align:middle;visibility:hidden;">

<div class="space"></div>

<div id="netBox">
<span class="label"><b>Multiplayer</b></span>
<div id="netOff">
<button id="hostBtn" onclick="hostRoom()">Host a room</button>
<br><span class="label">or join a friend:</span>
<input type="text" id="roomCode" class="field" placeholder="room code" maxlength="6" autocomplete="off">
<button id="joinBtn" onclick="joinRoom()">Join</button>
</div>
<div id="netOn" style="display:none">
<span class="label">Room code:</span>
<span class="label" id="roomShow"></span>
<button onclick="leaveRoom('You left the room.')">Leave room</button>
</div>
<div id="netStatus" class="label"></div>
<div id="netList" class="label"></div>
</div>

<div class="space"></div>

<button id="start" onclick="startGame()">start</button>
</div>

function isTablet() {
  var ua = navigator.userAgent;
  var isIpad = /iPad/i.test(ua);
  var isNewIpad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  var isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
  var smallSide = Math.min(screen.width, screen.height);
  var isBigTouchScreen = navigator.maxTouchPoints > 0 && smallSide >= 600;
  return isIpad || isNewIpad || isAndroidTablet || isBigTouchScreen;
}

if (isTablet()) {
  document.getElementById("showLeaderboard").checked = true;
}

function updateClubIcon() {
  var pick = document.getElementById("buildersClub").value;
  var icon = document.getElementById("clubIcon");
  if (pick == "") {
    icon.style.visibility = "hidden";
  } else {
    icon.src = clubIcons[pick];
    icon.style.visibility = "visible";
  }
}

function showClientError(message) {
  document.getElementById("rbxErrTxt").textContent = message;
  document.getElementById("rbxErr").style.display = "block";
}

function checkPlaceFile(text) {
  var xml = new DOMParser().parseFromString(text, "application/xml");
  if (xml.querySelector("parsererror")) {
    showClientError("This file is not valid XML. Re-export the place as an .rbxlx file and try again.");
    return false;
  }
  var rootName = xml.documentElement ? xml.documentElement.tagName.toLowerCase() : "";
  if (rootName !== "roblox" || !xml.getElementsByTagName("Item").length) {
    showClientError("This does not look like a Roblox .rbxlx place file. Choose an exported .rbxlx file.");
    return false;
  }
  return true;
}

function setLoadingInfo() {
  var title = document.getElementById("placeTitle").value.trim();
  var creator = document.getElementById("creatorName").value.trim();
  if (title == "") {
    title = window.LOADING_INFO.name;
  }
  if (creator == "") {
    creator = window.LOADING_INFO.creator;
  }
  window.LOADING_INFO.name = title;
  window.LOADING_INFO.creator = creator;
  document.getElementById("rlPlace").textContent = title;
  document.getElementById("rlCreator").textContent = "By " + creator;
  document.title = title;
}

function loadGameCode() {
  var three = document.createElement("script");
  three.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
  three.onload = function () {
    var game = document.createElement("script");
    game.text = document.getElementById("gameCode").text;
    document.body.appendChild(game);
  };
  three.onerror = function () {
    showClientError("The 3D engine could not be downloaded. Check your internet connection and reload the client.");
  };
  document.body.appendChild(three);
}

async function startGame(fromHost) {
  // Guests wait for the host. The host's map is sent to them and they start by themselves.
  if (Net.mode == "guest" && !fromHost) {
    return;
  }
  if (Net.started) {
    return;
  }
  playerName = document.getElementById("username").value;
  if (Net.mode != "") {
    playerName = Net.myName;   // use the name from the room
  }
  var placeFile = document.getElementById("rbxlxFile").files[0];

  try {
    window.rbxPlaceText = "";
    if (fromHost) {
      window.rbxPlaceText = Net.mapText;   // the map the host sent us
      if (window.rbxPlaceText != "" && !checkPlaceFile(window.rbxPlaceText)) {
        return;
      }
    } else if (placeFile) {
      var fileName = placeFile.name.toLowerCase();
      if (!fileName.endsWith(".rbxlx") && !fileName.endsWith(".xml")) {
        showClientError("That file type is not supported. Choose an .rbxlx place file.");
        return;
      }
      window.rbxPlaceText = await placeFile.text();
      if (!checkPlaceFile(window.rbxPlaceText)) {
        return;
      }
    }
  } catch (e) {
    showClientError("The selected place file could not be read. Try choosing the .rbxlx file again.");
    return;
  }

  clubChoice = document.getElementById("buildersClub").value;

  if (document.getElementById("showLeaderboard").checked) {
    localStorage.setItem("tabletMode", "1");
  } else {
    localStorage.setItem("tabletMode", "0");
  }

  setLoadingInfo();
  Net.started = true;
  if (Net.mode == "host") {
    Net.mapText = window.rbxPlaceText;
    netHostStartGame();   // send the map to the guests so they start too
  }
  document.getElementById("startScreen").style.display = "none";
  window.rbxResetTimer();
  loadGameCode();
}
</script>
<script>

var NET_MAX_PLAYERS = 10;
var NET_PEER_CONFIG = {
  debug: 0,
  config: {
    iceTransportPolicy: "relay",
    iceCandidatePoolSize: 2,
    iceServers: [
      { urls: "turn:eu-0.turn.peerjs.com:3478", username: "peerjs", credential: "peerjsp" },
      { urls: "turn:us-0.turn.peerjs.com:3478", username: "peerjs", credential: "peerjsp" },
      { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turns:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
    ]
  }
};
var NET_STATE_KEYS = ["x", "y", "z", "yaw", "speed", "air", "dead", "hp", "maxHp"];

var netPeer = null;
var netToHost = null;
var netGuests = [];
var netNextId = 1;
var netMapParts = [];
var netMapSize = 0;

function netEl(id) {
  return document.getElementById(id);
}

function netCleanName(text) {
  text = String(text || "");
  text = text.replace(/[\u0000-\u001f<>]/g, "");
  text = text.trim().replace(/\s+/g, "_");
  text = text.slice(0, 20);
  if (text == "") {
    text = "Player";
  }
  return text;
}

function netCleanText(text) {
  text = String(text == null ? "" : text);
  return text.replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, 200);
}

function netSay(text) {
  Net.chatInbox.push({ name: "", text: text });
}

function netSetStatus(text, isError) {
  var box = netEl("netStatus");
  box.textContent = text;
  box.style.color = isError ? "#ff8c8c" : "white";
}

function netSetBusy(busy) {
  netEl("hostBtn").disabled = busy;
  netEl("joinBtn").disabled = busy;
}

function netMakeCode() {
  var code = "";
  for (var i = 0; i < 6; i++) {
    code += NET_CHARS.charAt(Math.floor(Math.random() * NET_CHARS.length));
  }
  return code;
}

function netSleep(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function netPeerErrorText(err) {
  var type = String((err && err.type) || "error");
  if (type == "network" || type == "server-error" || type == "socket-error" || type == "socket-closed") {
    return "Could not reach the multiplayer server (PeerJS). It may be down or blocked on this network.";
  }
  if (type == "webrtc") {
    return "Could not set up a relayed connection. The relay server may be down or blocked on this network.";
  }
  return "Connection problem: " + type.replace(/-/g, " ") + ".";
}

function netSend(conn, message) {
  try {
    if (conn && conn.open) {
      conn.send(message);
    }
  } catch (e) {}
}

function netSendToAllGuests(message, exceptGuest) {
  for (var i = 0; i < netGuests.length; i++) {
    var g = netGuests[i];
    if (g !== exceptGuest) {
      netSend(g.conn, message);
    }
  }
}

function netRefreshScreen() {
  var inRoom = Net.mode != "";
  netEl("netOff").style.display = inRoom ? "none" : "block";
  netEl("netOn").style.display = inRoom ? "block" : "none";
  netEl("roomShow").textContent = Net.roomCode;
  netEl("username").disabled = inRoom;

  var startButton = netEl("start");
  if (Net.mode == "guest") {
    startButton.disabled = true;
    startButton.textContent = "waiting for host...";
  } else {
    startButton.disabled = false;
    startButton.textContent = "start";
  }

  var names = [];
  if (inRoom) {
    names.push(Net.myName + " (you)");
  }
  for (var id in Net.players) {
    names.push(Net.players[id].name);
  }
  netEl("netList").textContent = inRoom ? "Players: " + names.join(", ") : "";
}

function netAddPlayer(id, name) {
  if (Net.players[id]) {
    return;
  }
  Net.players[id] = {
    id: id, name: name, got: false,
    x: 0, y: 0, z: 0, yaw: 0, speed: 0, air: 0, dead: 0, hp: 100, maxHp: 100
  };
  netRefreshScreen();
}

function netRemovePlayer(id) {
  delete Net.players[id];
  netRefreshScreen();
}

function netPickState(m) {
  var s = { t: "s" };
  for (var i = 0; i < NET_STATE_KEYS.length; i++) {
    var key = NET_STATE_KEYS[i];
    if (typeof m[key] == "number" && isFinite(m[key])) {
      s[key] = m[key];
    }
  }
  return s;
}

function netApplyState(player, s) {
  for (var i = 0; i < NET_STATE_KEYS.length; i++) {
    var key = NET_STATE_KEYS[i];
    if (s[key] !== undefined) {
      player[key] = s[key];
    }
  }
  player.got = true;
}

function netNameInUse(name) {
  var lower = name.toLowerCase();
  if (Net.myName.toLowerCase() == lower) {
    return true;
  }
  for (var i = 0; i < netGuests.length; i++) {
    if (netGuests[i].name.toLowerCase() == lower) {
      return true;
    }
  }
  return false;
}

function netLoadPeerJS(whenReady) {
  if (window.Peer) {
    whenReady();
    return;
  }
  var script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
  script.onload = whenReady;
  script.onerror = function () {
    netSetBusy(false);
    netSetStatus("Could not load the multiplayer library. Check your internet.", true);
  };
  document.head.appendChild(script);
}

function hostRoom() {
  var myName = netCleanName(netEl("username").value);
  netSetBusy(true);
  netSetStatus("Making a room...", false);

  netLoadPeerJS(function () {
    var tries = 0;

    function tryMakeRoom() {
      var code = netMakeCode();
      var peer = new Peer(NET_PREFIX + code, NET_PEER_CONFIG);
      netPeer = peer;

      peer.on("open", function () {
        Net.mode = "host";
        Net.myId = "host";
        Net.myName = myName;
        Net.roomCode = code;
        netNextId = 1;
        netGuests = [];
        netSetBusy(false);
        netSetStatus("You are the host. Send your friends the room code, then press start.", false);
        netRefreshScreen();
      });

      peer.on("connection", function (conn) {
        netHostGotConnection(conn);
      });

      peer.on("disconnected", function () {
        if (netPeer === peer && !peer.destroyed) {
          try { peer.reconnect(); } catch (e) {}
        }
      });

      peer.on("error", function (err) {
        if (netPeer !== peer) {
          return;
        }
        if (Net.mode == "host") {
          if (err.type == "network" || err.type == "server-error" || err.type == "socket-error" || err.type == "socket-closed") {
            netSetStatus("Connection to the multiplayer server was lost. Reconnecting...", true);
          }
          return;
        }
        if (err.type == "unavailable-id" && tries < 5) {
          tries++;
          try { peer.destroy(); } catch (e) {}
          tryMakeRoom();
          return;
        }
        leaveRoom(netPeerErrorText(err), true);
      });
    }

    tryMakeRoom();
  });
}

function netHostGotConnection(conn) {
  var guest = { conn: conn, id: "", name: "" };

  conn.on("data", function (m) {
    if (!m || typeof m != "object") {
      return;
    }
    if (m.t == "hi" && guest.id == "") {
      netHostAcceptGuest(guest, m);
      return;
    }
    if (guest.id == "") {
      return;
    }

    if (m.t == "s") {
      var player = Net.players[guest.id];
      if (player) {
        var state = netPickState(m);
        netApplyState(player, state);
        state.id = guest.id;
        netSendToAllGuests(state, guest);
      }
    } else if (m.t == "c") {
      var text = netCleanText(m.x);
      if (text != "") {
        Net.chatInbox.push({ name: guest.name, text: text });
        netSendToAllGuests({ t: "c", n: guest.name, x: text }, guest);
      }
    } else if (m.t == "bye") {
      try { conn.close(); } catch (e) {}
    }
  });

  conn.on("close", function () { netHostGuestLeft(guest); });
  conn.on("error", function () { netHostGuestLeft(guest); });
}

function netHostAcceptGuest(guest, m) {
  if (netGuests.length >= NET_MAX_PLAYERS - 1) {
    netSend(guest.conn, { t: "x", m: "That room is full." });
    setTimeout(function () {
      try { guest.conn.close(); } catch (e) {}
    }, 400);
    return;
  }

  var baseName = netCleanName(m.n);
  var name = baseName;
  var number = 2;
  while (netNameInUse(name)) {
    name = baseName.slice(0, 17) + number;
    number++;
  }

  guest.id = "p" + netNextId;
  netNextId++;
  guest.name = name;
  netGuests.push(guest);

  var list = [{ id: "host", n: Net.myName }];
  for (var i = 0; i < netGuests.length; i++) {
    if (netGuests[i] !== guest) {
      list.push({ id: netGuests[i].id, n: netGuests[i].name });
    }
  }
  netSend(guest.conn, { t: "w", id: guest.id, n: guest.name, l: list });

  netSendToAllGuests({ t: "j", id: guest.id, n: guest.name }, guest);

  netAddPlayer(guest.id, guest.name);
  netSay(guest.name + " joined the game.");
  netSetStatus(guest.name + " joined the room.", false);

  if (Net.started) {
    netSendMap(guest);
  }
}

function netHostGuestLeft(guest) {
  var index = netGuests.indexOf(guest);
  if (index < 0) {
    return;
  }
  netGuests.splice(index, 1);
  netRemovePlayer(guest.id);
  netSendToAllGuests({ t: "l", id: guest.id }, null);
  netSay(guest.name + " left the game.");
  netSetStatus(guest.name + " left the room.", false);
}

async function netSendMap(guest) {
  var text = Net.mapText;
  var pieceSize = 16000;
  netSend(guest.conn, { t: "pb" });
  for (var i = 0; i < text.length; i += pieceSize) {
    while (guest.conn.open && guest.conn.dataChannel && guest.conn.dataChannel.bufferedAmount > 2000000) {
      await netSleep(40);
    }
    if (!guest.conn.open) {
      return;
    }
    netSend(guest.conn, { t: "pc", d: text.slice(i, i + pieceSize) });
  }
  netSend(guest.conn, { t: "pe", title: Net.mapTitle, creator: Net.mapCreator });
}

function netHostStartGame() {
  Net.mapTitle = window.LOADING_INFO.name;
  Net.mapCreator = window.LOADING_INFO.creator;
  for (var i = 0; i < netGuests.length; i++) {
    netSendMap(netGuests[i]);
  }
}

function joinRoom() {
  var code = netEl("roomCode").value.trim().toUpperCase();
  if (code.length != 6) {
    netSetStatus("Type the 6 letter room code first.", true);
    return;
  }
  var myName = netCleanName(netEl("username").value);
  netSetBusy(true);
  netSetStatus("Connecting...", false);

  netLoadPeerJS(function () {
    var peer = new Peer(NET_PEER_CONFIG);
    netPeer = peer;
    var finished = false;

    function fail(text) {
      if (finished) {
        return;
      }
      finished = true;
      clearTimeout(timer);
      leaveRoom(text, true);
    }
    var timer = setTimeout(function () {
      fail("Could not reach that room. Check the code and try again.");
    }, 30000);

    peer.on("open", function () {
      var conn = peer.connect(NET_PREFIX + code, { reliable: true });
      netToHost = conn;

      conn.on("open", function () {
        netSend(conn, { t: "hi", n: myName });
      });

      conn.on("data", function (m) {
        if (!m || typeof m != "object") {
          return;
        }
        if (m.t == "w") {
          finished = true;
          clearTimeout(timer);
          Net.mode = "guest";
          Net.myId = String(m.id);
          Net.myName = netCleanName(m.n);
          Net.roomCode = code;
          var list = m.l || [];
          for (var i = 0; i < list.length; i++) {
            netAddPlayer(String(list[i].id), netCleanName(list[i].n));
          }
          netSetBusy(false);
          netSetStatus("Joined! Waiting for the host to press start...", false);
          netRefreshScreen();
        } else if (m.t == "x") {
          fail(String(m.m || "Could not join."));
        } else if (Net.mode == "guest") {
          netGuestGotMessage(m);
        }
      });

      conn.on("close", function () {
        if (netToHost !== conn) {
          return;
        }
        if (Net.mode == "guest") {
          leaveRoom("The host closed the room.", true);
        } else {
          fail("Could not connect to that room.");
        }
      });

      conn.on("error", function () {
        if (netToHost !== conn) {
          return;
        }
        if (Net.mode == "guest") {
          leaveRoom("Lost connection to the host.", true);
        } else {
          fail("Could not connect to that room.");
        }
      });
    });

    peer.on("disconnected", function () {
      if (netPeer === peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on("error", function (err) {
      if (netPeer !== peer || Net.mode == "guest") {
        return;
      }
      if (err.type == "peer-unavailable") {
        fail("No room found with that code.");
      } else {
        fail(netPeerErrorText(err));
      }
    });
  });
}

function netGuestGotMessage(m) {
  if (m.t == "j") {
    netAddPlayer(String(m.id), netCleanName(m.n));
    netSay(netCleanName(m.n) + " joined the game.");
  } else if (m.t == "l") {
    var leaver = Net.players[String(m.id)];
    if (leaver) {
      netSay(leaver.name + " left the game.");
      netRemovePlayer(String(m.id));
    }
  } else if (m.t == "s") {
    var player = Net.players[String(m.id)];
    if (player) {
      netApplyState(player, netPickState(m));
    }
  } else if (m.t == "c") {
    var text = netCleanText(m.x);
    if (text != "") {
      Net.chatInbox.push({ name: netCleanName(m.n), text: text });
    }
  } else if (m.t == "pb") {
    netMapParts = [];
    netMapSize = 0;
    netSetStatus("Receiving the host's map...", false);
  } else if (m.t == "pc") {
    if (typeof m.d == "string") {
      netMapParts.push(m.d);
      netMapSize += m.d.length;
      netSetStatus("Receiving the host's map... " + (netMapSize / 1048576).toFixed(1) + " MB", false);
    }
  } else if (m.t == "pe") {
    Net.mapText = netMapParts.join("");
    netMapParts = [];
    netEl("placeTitle").value = netCleanText(m.title).slice(0, 40);
    netEl("creatorName").value = netCleanText(m.creator).slice(0, 20);
    netSetStatus("Starting...", false);
    startGame(true);
  } else if (m.t == "bye") {
    leaveRoom("The host left the room.", true);
  }
}

function leaveRoom(message, isError) {
  var wasMode = Net.mode;
  var hostConnection = netToHost;
  var guests = netGuests;
  var peer = netPeer;

  netToHost = null;
  netGuests = [];
  netPeer = null;
  Net.mode = "";
  Net.myId = "";
  Net.roomCode = "";
  Net.players = {};

  if (wasMode == "host") {
    for (var i = 0; i < guests.length; i++) {
      netSend(guests[i].conn, { t: "bye" });
    }
  } else if (wasMode == "guest") {
    netSend(hostConnection, { t: "bye" });
  }
  try { if (hostConnection) { hostConnection.close(); } } catch (e) {}
  for (var j = 0; j < guests.length; j++) {
    try { guests[j].conn.close(); } catch (e) {}
  }
  try { if (peer) { peer.destroy(); } } catch (e) {}

  netSetBusy(false);
  netSetStatus(message || "", isError);
  netRefreshScreen();
  if (Net.started && message) {
    netSay(message);
  }
}

addEventListener("pagehide", function () {
  if (Net.mode != "") {
    leaveRoom();
  }
});

Net.sendState = function (state) {
  if (Net.mode == "host") {
    state.t = "s";
    state.id = "host";
    netSendToAllGuests(state, null);
  } else if (Net.mode == "guest") {
    state.t = "s";
    netSend(netToHost, state);
  }
};

Net.sendChat = function (text) {
  if (Net.mode == "host") {
    netSendToAllGuests({ t: "c", n: Net.myName, x: text }, null);
  } else if (Net.mode == "guest") {
    netSend(netToHost, { t: "c", x: text });
  }
};

netEl("roomCode").addEventListener("input", function () {
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});

const rShield=$('div','position:fixed;left:0;top:0;width:100%;height:100%;z-index:21;background:rgba(51,51,51,.4);display:none',document.body);

$('div','line-height:20px',rForm,'This will send a complete report to a moderator.  The moderator will review the chat log and take appropriate action.');

const slider=(name,min,max,step,val,fmt,f)=>{
const w=$('div','display:flex;flex-direction:column;gap:2px;color:#fff;font:700 14px "Source Sans Pro",Arial,sans-serif',menu);

function bub9(x,y,w,h){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
const S=96,c=24,s=12,xs=[0,c,S-c,S],ys=xs,xd=[x,x+s,x+w-s,x+w],yd=[y,y+s,y+h-s,y+h];

function pumpBubbles(){
const b=bubbles[0];
if(!b||!b.dead||b.fading)return;
b.fading=performance.now();
setTimeout(()=>{bubbles.shift();pumpBubbles()},700);}
function wrapBub(msg){
bctx.font=BUB_FONT;const maxW=370,out=[],w=t=>bctx.measureText(t).width;let line='';
for(let word of msg.split(' ')){
const test=line?line+' '+word:word;
if(w(test)<=maxW){line=test;continue}
if(line){out.push(line);line=''}
while(w(word)>maxW){let i=1;while(i<word.length&&w(word.slice(0,i+1))<=maxW)i++;out.push(word.slice(0,i));word=word.slice(i)}
line=word}
out.push(line);return out}
function bubbleSay(msg){
if(msg[0]=='/')return;
msg=msg.slice(0,127);
const lines=wrapBub(msg);
bctx.font=BUB_FONT;
const tw=Math.max(...lines.map(l=>bctx.measureText(l).width));
for(const o of bubbles)o.old=1;
const b={lines,w:Math.min(400,Math.ceil(tw)+30),h:lines.length*34,old:0,dead:0,fading:0};bubbles.push(b);
setTimeout(()=>{b.dead=1;pumpBubbles()},(8+7*Math.min(msg.length/75,1))*1000);}
function bubRR(x,y,w,h,r){bctx.beginPath();bctx.moveTo(x+r,y);bctx.arcTo(x+w,y,x+w,y+h,r);bctx.arcTo(x+w,y+h,x,y+h,r);bctx.arcTo(x,y+h,x,y,r);bctx.arcTo(x,y,x+w,y,r);bctx.closePath()}
function updateBubbles(){
const cw=R.domElement.width,ch=R.domElement.height;
if(bubCv.width!==cw||bubCv.height!==ch){bubCv.width=cw;bubCv.height=ch;bubDrawn=1}
if(!bubbles.length){if(bubDrawn){bctx.clearRect(0,0,cw,ch);bubDrawn=0}return}
cam.updateMatrixWorld();
hv.set(foc.x,foc.y+2.1,foc.z);
const d=cam.position.distanceTo(hv);
hv.project(cam);
bctx.setTransform(1,0,0,1,0,0);bctx.clearRect(0,0,cw,ch);bubDrawn=1;
if(hv.z>1||d>=100)return;
bctx.setTransform(cw/VWv,0,0,ch/VHv,0,0);
const cx=(hv.x*.5+.5)*VWv;let bottom=(-hv.y*.5+.5)*VHv;
const now=performance.now();
bctx.font=BUB_FONT;bctx.textAlign='center';bctx.textBaseline='middle';
for(let i=bubbles.length-1;i>=0;i--){
const b=bubbles[i];
const top=bottom-14-b.h;
bctx.globalAlpha=b.fading?Math.max(0,1-(now-b.fading)/670):1;
if(bubArtOK()){bub9(cx-b.w/2-3,top-3,b.w+6,b.h+6);if(!b.old)bctx.drawImage(BUB_TAIL,Math.round(cx-15),Math.round(top+b.h-4),30,16)}
else{bctx.fillStyle='#fff';bubRR(cx-b.w/2,top,b.w,b.h,8);bctx.fill();
if(!b.old){bctx.beginPath();bctx.moveTo(cx-14,top+b.h-1);bctx.lineTo(cx+14,top+b.h-1);bctx.lineTo(cx,top+b.h+13);bctx.closePath();bctx.fill()}}
bctx.fillStyle=b.old?'rgba(27,42,53,.5)':'rgb(27,42,53)';
b.lines.forEach((l,j)=>bctx.fillText(l,cx,top+j*34+17));
bottom=top}
bctx.globalAlpha=1}

lastHit=now;hp-=20;

if(hp!==lastH)setHealth(hp);

const c=Math.cos(pit),tx=foc.x,ty=foc.y,tz=foc.z;

if(fp&&mlOk&&!mlock){setMlock(true);fpAuto=true}

fpPrev=fp}

pHead.getWorldPosition(HP);

cam.lookAt(tx,ty,tz)}
sky.position.copy(cam.position);updateBubbles();updateTag();}

const RENDER_DIST=window.RENDER_DIST||200;
let cullTick=0;
function cullWorld(){
if((cullTick++&3)!==0)return;
const cx=cam.position.x,cy=cam.position.y,cz=cam.position.z;
for(let i=0;i<worldMeshes.length;i++){
const m=worldMeshes[i],g=m.geometry;
if(!g.boundingSphere)g.computeBoundingSphere();
const dx=m.position.x-cx,dy=m.position.y-cy,dz=m.position.z-cz;
const lim=RENDER_DIST+g.boundingSphere.radius;
m.visible=dx*dx+dy*dy+dz*dz<=lim*lim;
}}

const otherPlayers = {};
let netSendTimer = 0;

const otherMats = {torso: mat('#0d69ac'), arm: mat('#f5cd30'), leg: mat('#a4bd47'), head: mat('#f5cd30')};
otherMats.head.side = T.DoubleSide;
const otherGeos = {
  torso: createRoundedBox(2, 2, 1, cornerRoundness),
  arm: createRoundedBox(1, 2, 1, cornerRoundness),
  leg: createRoundedBox(1, 2, 1, cornerRoundness)
};

function makeOtherPlayer(info) {
  const group = new T.Group();
  scene.add(group);

  function addPart(geometry, material, x, y, z, meshY) {
    const pivot = new T.Group();
    pivot.position.set(x, y, z);
    const mesh = new T.Mesh(geometry, material);
    mesh.position.y = meshY;
    pivot.add(mesh);
    group.add(pivot);
    return pivot;
  }
  addPart(otherGeos.torso, otherMats.torso, 0, 3, 0, 0);
  const armL = addPart(otherGeos.arm, otherMats.arm, -1.5, 4, 0, -1);
  const armR = addPart(otherGeos.arm, otherMats.arm, 1.5, 4, 0, -1);
  const legL = addPart(otherGeos.leg, otherMats.leg, -.5, 2, 0, -1);
  const legR = addPart(otherGeos.leg, otherMats.leg, .5, 2, 0, -1);

  const headPivot = addPart(headGeo, otherMats.head, 0, 4.5, 0, 0);
  const faceMesh = new T.Mesh(face.geometry, face.material);
  faceMesh.layers.set(1);
  headPivot.add(faceMesh);

  const canvas = document.createElement('canvas');
  canvas.width = TAG_W;
  canvas.height = TAG_H;
  const texture = new T.CanvasTexture(canvas);
  texture.minFilter = T.LinearMipmapLinearFilter;
  texture.magFilter = T.LinearFilter;
  texture.premultiplyAlpha = true;
  const sprite = new T.Sprite(new T.SpriteMaterial({map: texture, transparent: true, premultipliedAlpha: true, depthTest: false, depthWrite: false, fog: false}));
  sprite.center.set(0.5, 0);
  sprite.layers.set(2);
  sprite.renderOrder = 999;
  scene.add(sprite);

  const o = {
    id: info.id, name: info.name, group: group, sprite: sprite, canvas: canvas, texture: texture,
    ctx: canvas.getContext('2d'), tagKey: '',
    arms: [armL, armR], legs: [legL, legR],
    x: 0, y: 0, z: 0, yaw: 0, started: false,
    phase: 0, swing: 0, air: 0
  };
  otherPlayers[info.id] = o;
  PlayerListAPI.addPlayer(info.name);
  return o;
}

function removeOtherPlayer(id) {
  const o = otherPlayers[id];
  scene.remove(o.group);
  scene.remove(o.sprite);
  o.sprite.material.dispose();
  o.texture.dispose();
  PlayerListAPI.removePlayer(o.name);
  delete otherPlayers[id];
}

function drawOtherTag(o, p) {
  const fraction = Math.max(0, Math.min(1, p.hp / p.maxHp)) || 0;
  const greenWidth = Math.round(fraction * TAG_BAR_W);
  const key = o.name + '|' + greenWidth;
  if (key === o.tagKey) return;
  o.tagKey = key;
  const c = o.ctx;
  c.clearRect(0, 0, TAG_W, TAG_H);
  let fontSize = 34;
  c.font = 'bold ' + fontSize + 'px "Source Sans Pro",Arial,sans-serif';
  while (c.measureText(o.name).width > TAG_W - 14 && fontSize > 14) {
    fontSize -= 2;
    c.font = 'bold ' + fontSize + 'px "Source Sans Pro",Arial,sans-serif';
  }
  c.textAlign = 'center';
  c.textBaseline = 'alphabetic';
  c.lineJoin = 'round';
  c.lineWidth = 3;
  c.strokeStyle = '#000';
  c.strokeText(o.name, TAG_W / 2, 34);
  c.fillStyle = '#fff';
  c.fillText(o.name, TAG_W / 2, 34);
  const barX = (TAG_W - TAG_BAR_W) / 2;
  const barY = TAG_H - TAG_BAR_H - 5;
  c.fillStyle = TAG_GREEN;
  c.fillRect(barX, barY, greenWidth, TAG_BAR_H);
  c.fillStyle = TAG_RED;
  c.fillRect(barX + greenWidth, barY, TAG_BAR_W - greenWidth, TAG_BAR_H);
  o.texture.needsUpdate = true;
}

function updateOtherPlayer(o, p, dt) {
  if (!p.got) {
    o.group.visible = false;
    o.sprite.visible = false;
    return;
  }

  if (!o.started || Math.hypot(p.x - o.x, p.z - o.z) > 40 || Math.abs(p.y - o.y) > 40) {
    o.x = p.x; o.y = p.y; o.z = p.z; o.yaw = p.yaw;
    o.started = true;
  } else {
    const k = 1 - Math.exp(-dt * 15);
    o.x += (p.x - o.x) * k;
    o.y += (p.y - o.y) * k;
    o.z += (p.z - o.z) * k;
    o.yaw += Math.atan2(Math.sin(p.yaw - o.yaw), Math.cos(p.yaw - o.yaw)) * k;
  }
  o.group.position.set(o.x, o.y, o.z);
  o.group.rotation.y = o.yaw;
  const alive = !p.dead;
  o.group.visible = alive;

  const speed = p.speed;
  const wantedSwing = (speed > .4 && !p.air) ? Math.min(.9, .22 + .04 * speed) : 0;
  o.swing += (wantedSwing - o.swing) * Math.min(1, dt * 14);
  if (speed > .4) o.phase += Math.min(30, speed / (2 * Math.max(o.swing, .25))) * dt;
  o.air += ((p.air ? 1 : 0) - o.air) * Math.min(1, dt * 12);
  const s = Math.sin(o.phase) * o.swing * (1 - o.air);
  o.legs[0].rotation.x = -(-s + o.air * .45);
  o.legs[1].rotation.x = -(s + o.air * .1);
  o.arms[0].rotation.x = -(.85 * s + o.air * .65);
  o.arms[1].rotation.x = -(-.85 * s + o.air * .5);

  tagPos.set(o.x, o.y + 5, o.z);
  const distance = cam.position.distanceTo(tagPos);
  o.sprite.visible = alive && distance <= TAG_MAX_DISTANCE;
  if (o.sprite.visible) {
    drawOtherTag(o, p);
    o.sprite.position.copy(tagPos);
    const worldPerPixel = 2 * distance * Math.tan(cam.fov * Math.PI / 360) / (R.domElement.clientHeight || innerHeight);
    const width = TAG_SCREEN_W * worldPerPixel;
    o.sprite.scale.set(width, width * TAG_H / TAG_W, 1);
  }
}
const tagPos = new T.Vector3();

function updateMultiplayer(dt) {
  while (Net.chatInbox.length > 0) {
    const c = Net.chatInbox.shift();
    if (c.name) say(c.name, c.text, '#ff9a4b');
    else plSys(c.text);
  }

  for (const id in Net.players) {
    if (!otherPlayers[id]) makeOtherPlayer(Net.players[id]);
  }
  for (const id in otherPlayers) {
    if (!Net.players[id]) removeOtherPlayer(id);
  }

  for (const id in otherPlayers) updateOtherPlayer(otherPlayers[id], Net.players[id], dt);

  if (Net.mode !== '') {
    netSendTimer += dt;
    if (netSendTimer >= .05) {
      netSendTimer = 0;
      Net.sendState({
        x: +P.x.toFixed(2), y: +P.y.toFixed(2), z: +P.z.toFixed(2),
        yaw: +face_.toFixed(3),
        speed: +Math.hypot(V.x, V.z).toFixed(1),
        air: grounded ? 0 : 1,
        dead: dead ? 1 : 0,
        hp: Math.round(hp), maxHp: maxHp
      });
    }
  }
}
